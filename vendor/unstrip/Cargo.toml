[package]
edition = "2021"
rust-version = "1.85"
name = "unstrip"
version = "1.2.0"
authors = ["Riven Labs <mohamed@riven-labs.com>"]
build = false
exclude = [
    "testdata/",
    "mb-corpus/",
    "benches/",
    "fuzz/",
    ".github/",
    ".editorconfig",
    ".gitignore",
]
autolib = false
