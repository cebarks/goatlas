[package]
name = "golang-symbol"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Inventory recorded Go module identity and retained function evidence from Linux ELF x86-64 binaries without executing them"

[dependencies]
unstrip = "=1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
unstrip = { path = "vendor/unstrip" }
