name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The inline-layout gate rejects Go 1.28+, so pin the 1.27 line.
      # GOTOOLCHAIN=local in the justfile recipes keeps the installed
      # toolchain from being silently upgraded.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # fixtures-oldgo requires a pre-installed mise go1.25.7 (mise where
      # never downloads inside the recipes; installing here is setup).
      - uses: jdx/mise-action@v2
        with:
          install: false
      - run: mise install go@1.25.7

      - name: Install just
        run: |
          curl -fsSL https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Full check (fixtures, tests, vendor patch-check, fmt, Clippy)
        run: just check
